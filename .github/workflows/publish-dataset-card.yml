name: Publish Dataset Card
# See docs/dataset-publishing.md. Merging or pushing never uploads anything.
on:
  workflow_dispatch:
    inputs:
      destination:
        description: Exact approved HF dataset namespace/name
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish-card:
    if: github.ref == 'refs/heads/main' && vars.HF_DATASET_PUBLISH_ENABLED == 'true' && vars.HF_DATASET_REPO != '' && inputs.destination == vars.HF_DATASET_REPO
    environment: huggingface-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OIDC-capable Hub CLI
        run: python -m pip install 'huggingface_hub==1.19.0'
      - name: Upload the reviewed card directory
        env:
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
          HF_OIDC_RESOURCE: datasets/${{ vars.HF_DATASET_REPO }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*', os.environ['HF_DATASET_REPO']):
              raise SystemExit('Invalid dataset namespace/name')
          PY
          hf upload "$HF_DATASET_REPO" ./hf-datacard . --repo-type dataset --commit-message "Dataset card from $GITHUB_SHA"
