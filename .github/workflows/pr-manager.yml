name: PR Manager
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to summarize
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        with:
          script: |
            const raw = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]{0,8}$/.test(raw)) throw new Error('Invalid PR number');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: Number(raw), per_page: 100
            });
            // Filename data is never interpolated into executable source or shell.
            await core.summary.addHeading(`PR ${raw}`).addCodeBlock(
              files.map(file => file.filename).join('\n'), 'text'
            ).write();
