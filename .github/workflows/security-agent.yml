name: Security Agent
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit Rust lockfile
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Check for credential-like assignments without disclosing matches
        if: always()
        run: python3 scripts/check-secret-patterns.py
# No comments, labels or PRs are posted.
